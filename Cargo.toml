[package]
name = "llm"
version = "0.1.0"
edition = "2021"
description = "Local LLM Manager - a friendly terminal UI for running local models"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
